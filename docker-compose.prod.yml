services:
  # Infrastructure services
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lableit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lableit}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - lableit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lableit} -d ${POSTGRES_DB:-lableit}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - lableit-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - lableit-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    # No public-read policy: the API serves every object through presigned URLs.
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb myminio/$${S3_BUCKET} --ignore-existing;
      echo 'Bucket $${S3_BUCKET} created successfully';
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-lableit}
    networks:
      - lableit-network

  # Application services
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3001
      API_HOST: 0.0.0.0
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${POSTGRES_USER:-lableit}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lableit}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-lableit}
      INFERENCE_URL: http://inference:8001
      FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
      NODE_ENV: production
      # Only needed when the browser calls the API from another origin
      # (comma-separated, no spaces). Unset is fine behind the web /api proxy.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # API role: serve HTTP, do not run the BullMQ worker (see worker service).
      WORKER_MODE: "false"
      RUN_HTTP_SERVER: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      # Exports are written to local disk by whichever process runs the export
      # job, and served over HTTP by the api. The worker runs those jobs, so both
      # containers must share this directory or downloads 404.
      - exports_data:/app/apps/api/exports
    restart: unless-stopped
    networks:
      - lableit-network
    healthcheck:
      # The oven/bun image ships wget, not curl.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  inference:
    build:
      # Inference Dockerfile is self-contained: its COPY paths (main.py,
      # download_models.py, assets/) are relative to apps/inference.
      context: apps/inference
      dockerfile: Dockerfile
    environment:
      PRELOAD_MODEL: "true"
      MODEL_CACHE_DIR: /app/models
      PYTHONUNBUFFERED: "1"
      # facebook/sam3 is a gated Hugging Face model: request access on its model
      # page, then set a token from an approved account.
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - inference_models:/app/models
    restart: unless-stopped
    networks:
      - lableit-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # GPU support - uncomment and configure based on your setup
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 4G
          # Uncomment for NVIDIA GPU support
          # devices:
          #   - driver: nvidia
          #     count: 1
          #     capabilities: [gpu]

  # Alternative inference service with explicit GPU runtime
  # Use this instead of the above if you need GPU support
  # inference-gpu:
  #   build:
  #     context: apps/inference
  #     dockerfile: Dockerfile
  #   runtime: nvidia
  #   environment:
  #     NVIDIA_VISIBLE_DEVICES: all
  #     PRELOAD_MODEL: "true"
  #     MODEL_CACHE_DIR: /app/models
  #   volumes:
  #     - inference_models:/app/models
  #   restart: unless-stopped
  #   networks:
  #     - lableit-network
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    environment:
      # Read by the container start script (written to /runtime-config.js).
      # nginx proxies /api/ to this address (the api service listens on 3001).
      API_URL: http://api:3001
    # Plain HTTP only; terminate TLS in front of this container (see DEPLOYMENT.md).
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lableit-network
    healthcheck:
      # nginx:alpine ships busybox wget, not curl.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # Worker service for background jobs
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3002
      API_HOST: 0.0.0.0
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${POSTGRES_USER:-lableit}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lableit}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-lableit}
      INFERENCE_URL: http://inference:8001
      FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
      NODE_ENV: production
      # Only needed when the browser calls the API from another origin
      # (comma-separated, no spaces). Unset is fine behind the web /api proxy.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # Worker role: run the BullMQ worker only, no HTTP listener.
      WORKER_MODE: "true"
      RUN_HTTP_SERVER: "false"
    # The root package.json has no "start" script, so run it from apps/api.
    # This skips /start.sh on purpose: only the api service runs migrations.
    command: ["bun", "--cwd", "apps/api", "run", "start"]
    # The image HEALTHCHECK probes HTTP /health, which the worker does not serve.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      # Same exports directory as the api service, see the note there.
      - exports_data:/app/apps/api/exports
    restart: unless-stopped
    networks:
      - lableit-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
      # Scale workers as needed
      # replicas: 2

volumes:
  postgres_data:
    driver: local
  exports_data:
    driver: local
  minio_data:
    driver: local
  inference_models:
    driver: local

networks:
  lableit-network:
    driver: bridge
