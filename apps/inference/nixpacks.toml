# Nixpacks configuration for Inference service
# Used when deploying without Docker

[variables]
PYTHONUNBUFFERED = "1"

[phases.setup]
nixPkgs = ['python311', 'ffmpeg']

[phases.install]
cmds = [
  'pip install --upgrade pip',
  'pip install -r requirements.txt'
]

[start]
cmd = 'uvicorn main:app --host 0.0.0.0 --port ${PORT:-8001}'
