# Lableit Web Frontend - Railway Configuration
# Build context is the REPO ROOT (the Dockerfile copies package.json, bun.lock
# and packages/shared). In the Railway service settings leave Root Directory
# empty and set the Railway Config File to /apps/web/railway.toml.

[build]
builder = "dockerfile"
dockerfilePath = "apps/web/Dockerfile"

[deploy]
startCommand = "/start.sh"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
