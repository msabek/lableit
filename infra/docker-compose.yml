services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lableit
      POSTGRES_PASSWORD: lableit
      POSTGRES_DB: lableit
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lableit -d lableit"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 2s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      # MINIO_ACCESS_KEY/MINIO_SECRET_KEY are deprecated; use ROOT_USER/PASSWORD.
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Create the bucket on startup (matches the prod compose minio-init service).
  # Defaults align with apps/.env.example (S3_BUCKET=lableit, minioadmin creds).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/lableit --ignore-existing;
      mc anonymous set download myminio/lableit;
      echo 'Bucket lableit created successfully';
      exit 0;
      "

volumes:
  pgdata:
  minio-data:
