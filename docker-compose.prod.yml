services:
  # Infrastructure services
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lableit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lableit}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - lableit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lableit} -d ${POSTGRES_DB:-lableit}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - lableit-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - lableit-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb myminio/$${S3_BUCKET} --ignore-existing;
      mc anonymous set download myminio/$${S3_BUCKET};
      echo 'Bucket $${S3_BUCKET} created successfully';
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-lableit}
    networks:
      - lableit-network

  # Application services
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3001
      API_HOST: 0.0.0.0
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${POSTGRES_USER:-lableit}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lableit}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-lableit}
      JWT_SECRET: ${JWT_SECRET}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      INFERENCE_URL: http://inference:8001
      FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
      NODE_ENV: production
      # API role: serve HTTP, do not run the BullMQ worker (see worker service).
      WORKER_MODE: "false"
      RUN_HTTP_SERVER: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lableit-network
    healthcheck:
      # The oven/bun image ships wget, not curl.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  inference:
    build:
      # Inference Dockerfile is self-contained: its COPY paths (main.py,
      # download_models.py, assets/) are relative to apps/inference.
      context: apps/inference
      dockerfile: Dockerfile
    environment:
      PRELOAD_MODEL: "true"
      MODEL_CACHE_DIR: /app/models
      PYTHONUNBUFFERED: "1"
    volumes:
      - inference_models:/app/models
    restart: unless-stopped
    networks:
      - lableit-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # GPU support - uncomment and configure based on your setup
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 4G
          # Uncomment for NVIDIA GPU support
          # devices:
          #   - driver: nvidia
          #     count: 1
          #     capabilities: [gpu]

  # Alternative inference service with explicit GPU runtime
  # Use this instead of the above if you need GPU support
  # inference-gpu:
  #   build:
  #     context: apps/inference
  #     dockerfile: Dockerfile
  #   runtime: nvidia
  #   environment:
  #     NVIDIA_VISIBLE_DEVICES: all
  #     PRELOAD_MODEL: "true"
  #     MODEL_CACHE_DIR: /app/models
  #   volumes:
  #     - inference_models:/app/models
  #   restart: unless-stopped
  #   networks:
  #     - lableit-network
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "${WEB_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lableit-network
    healthcheck:
      # nginx:alpine ships busybox wget, not curl.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # Worker service for background jobs
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3002
      API_HOST: 0.0.0.0
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${POSTGRES_USER:-lableit}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lableit}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-lableit}
      JWT_SECRET: ${JWT_SECRET}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      INFERENCE_URL: http://inference:8001
      FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
      NODE_ENV: production
      # Worker role: run the BullMQ worker only, no HTTP listener.
      WORKER_MODE: "true"
      RUN_HTTP_SERVER: "false"
    command: ["bun", "run", "start"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lableit-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
      # Scale workers as needed
      # replicas: 2

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  inference_models:
    driver: local

networks:
  lableit-network:
    driver: bridge
